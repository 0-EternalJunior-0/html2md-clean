[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "html2md-clean"
version = "0.1.4"
description = "A clean HTML -> Markdown converter with noise removal (ads, popups, navigation) for web scraping and LLM pipelines."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "0-EternalJunior-0" }]
keywords = [
    "html",
    "markdown",
    "html2md",
    "html-to-markdown",
    "web-scraping",
    "boilerplate-removal",
    "content-extraction",
    "llm",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Text Processing :: Markup :: HTML",
    "Topic :: Text Processing :: Markup :: Markdown",
    "Topic :: Internet :: WWW/HTTP",
]
dependencies = [
    "pydantic>=2",
    "pydantic-settings==2.14.1",
    "beautifulsoup4",
    "lxml",
    "selectolax",
    "requests",
]

[project.optional-dependencies]
full = [
    "trafilatura",
    "ftfy",
    "courlan",
    "htmldate",
    "nh3",
]
dev = [
    "ruff",
    "mkdocs",
    "mkdocs-material",
]

[project.urls]
Homepage = "https://github.com/0-EternalJunior-0/html2md-clean"
Repository = "https://github.com/0-EternalJunior-0/html2md-clean"
Issues = "https://github.com/0-EternalJunior-0/html2md-clean/issues"

[project.scripts]
html2md = "main_service:main"

[tool.setuptools]
py-modules = ["main_service"]

[tool.setuptools.packages.find]
include = ["markdown*"]