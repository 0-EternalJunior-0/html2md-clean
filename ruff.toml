target-version = "py311"
line-length = 110

exclude = [
    ".git",
    ".venv",
    ".benchmarks",
    ".hypothesis",
    "__pycache__",
]

[lint]
select = ["E", "F", "W", "I"]

ignore = ["E501"]

[lint.per-file-ignores]
"test/*" = ["E402"]
# Публічний re-export у пакеті.
"markdown/__init__.py" = ["F401"]

[lint.isort]
known-first-party = ["markdown"]
